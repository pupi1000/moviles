name: detectorfilagasolina
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0' # Rango de SDK compatible con Flutter 3.x

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1 # Versión estable, si te sale error, prueba la última disponible que encuentres en pub.dev para tu versión de Flutter
  tflite_flutter: ^0.11.0 # Esta versión es compatible y estable
  image: ^4.1.7 # Esta versión es compatible
  permission_handler: ^12.0.0+1 # La última estable verificada para compatibilidad
  path_provider: ^2.1.3 # Compatible
  intl: ^0.20.2 # Para formatear fechas, actualizamos a la última versión compatible
  cupertino_icons: ^1.0.8 # Última versión compatible para iconos de iOS

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # Usamos la última versión de lints para Flutter 3.x

flutter:
  uses-material-design: true
  assets:
    - assets/tflite/ssd_mobilenet.tflite
    - assets/tflite/labelmap.txt
    - assets/images/bus.png
    - assets/images/car.png
    - assets/images/motorcycle.png
    - assets/images/truck.png